<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0D10">
<link rel="icon" href="favicon.png">
<title>Panel — Find GymBro</title>
<style>
  :root {
    --ground: #0B0D10; --raised: #14181D; --rule: #262D36;
    --ink: #F2F5F7; --ink-2: #9AA6B2; --ink-3: #5F6B78;
    --accent: #22C58B; --accent-hi: #7CF5C9; --ostrzez: #E8A33D; --blad: #FF5A4E;
    --sans: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, "Cascadia Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 62rem; margin: 0 auto; padding: clamp(1.75rem, 5vw, 3rem) clamp(1rem, 4vw, 2rem) 4rem; }

  /* ——— Logowanie ——— */
  .brama {
    min-height: 100svh; display: grid; place-items: center;
    padding: clamp(1.5rem, 5vw, 3rem);
  }
  .brama form {
    width: min(24rem, 100%);
    border: 1px solid var(--rule); border-radius: 18px; background: var(--raised);
    padding: clamp(1.75rem, 5vw, 2.25rem);
    display: grid; gap: 1rem;
    box-shadow: 0 30px 70px -40px rgba(0,0,0,.9);
  }
  .brama h1 { font-size: 1.2rem; font-weight: 680; letter-spacing: -.02em; margin: 0; }
  .brama .pod { font-size: .88rem; color: var(--ink-2); margin: -.55rem 0 .3rem; }
  label { display: grid; gap: .35rem; font-size: .8rem; color: var(--ink-2); }
  input {
    font: inherit; font-size: .95rem; color: var(--ink);
    background: var(--ground); border: 1px solid var(--rule); border-radius: 10px;
    padding: .7rem .85rem; width: 100%;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .glowny {
    font: inherit; font-weight: 620; font-size: .95rem; color: #06130D;
    background: var(--accent); border: 0; border-radius: 10px;
    padding: .75rem 1rem; cursor: pointer; margin-top: .25rem;
  }
  .glowny:disabled { opacity: .55; cursor: default; }
  .blad-formularza { font-size: .85rem; color: var(--blad); margin: 0; }

  /* ——— Panel ——— */
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: .75rem 1.25rem; margin-bottom: 2rem; }
  h1.tytul { font-size: 1.35rem; font-weight: 680; letter-spacing: -.02em; margin: 0; }
  .znacznik { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); }
  .spacer { flex: 1 1 auto; }
  button.drugi {
    font: inherit; font-size: .84rem; color: var(--ink-2);
    background: var(--raised); border: 1px solid var(--rule); border-radius: 99px;
    padding: .35rem .95rem; cursor: pointer;
    transition: border-color .2s, color .2s;
  }
  button.drugi:hover { border-color: var(--accent); color: var(--accent); }
  button.drugi:disabled { opacity: .5; cursor: default; }

  .komunikat {
    border: 1px solid var(--rule); border-left: 3px solid var(--ostrzez);
    background: var(--raised); border-radius: 10px;
    padding: 1rem 1.15rem; margin-bottom: 1.5rem;
  }
  .komunikat h2 { font-size: .98rem; font-weight: 650; margin: 0 0 .3rem; }
  .komunikat p { margin: 0; font-size: .9rem; color: var(--ink-2); }

  .grupa { margin-bottom: 2.5rem; }
  .grupa > h2 {
    font-family: var(--mono); font-size: .7rem; font-weight: 600;
    letter-spacing: .16em; text-transform: uppercase; color: var(--accent);
    margin: 0 0 .9rem; display: flex; align-items: center; gap: .5rem;
  }
  .grupa > h2::before {
    content: ""; width: .45rem; height: .45rem; border-radius: 99px;
    background: var(--accent); box-shadow: 0 0 8px rgba(34,197,139,.6);
  }

  .kafle { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .kafel {
    border: 1px solid var(--rule); border-radius: 14px; background: var(--raised);
    padding: 1rem 1.1rem 1.15rem; display: grid; gap: .15rem; align-content: start;
    position: relative; overflow: hidden;
  }
  .kafel .liczba {
    font-size: clamp(1.75rem, 4.5vw, 2.3rem); font-weight: 700;
    letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums;
  }
  .kafel .nazwa { font-size: .88rem; font-weight: 600; color: var(--ink); }
  .kafel .opis { font-size: .78rem; color: var(--ink-3); line-height: 1.45; }
  .kafel .zmiana {
    position: absolute; top: .9rem; right: 1rem;
    font-family: var(--mono); font-size: .72rem; font-weight: 600;
  }
  .zmiana.w-gore { color: var(--accent); }
  .zmiana.bez { color: var(--ink-3); }
  .kafel.wyliczony { border-color: color-mix(in srgb, var(--accent) 35%, var(--rule)); }
  .kafel.wyliczony .liczba { color: var(--accent); }

  /* ——— Lejek ——— */
  .lejek { border: 1px solid var(--rule); border-radius: 14px; background: var(--raised); padding: 1.25rem 1.35rem 1.4rem; display: grid; gap: .85rem; }
  .lejek .krok { display: grid; grid-template-columns: 1fr auto; gap: .3rem .75rem; align-items: baseline; }
  .lejek .etykieta { font-size: .88rem; font-weight: 600; }
  .lejek .osoby { font-family: var(--mono); font-size: .82rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .lejek .tor { grid-column: 1 / -1; height: 10px; border-radius: 99px; background: var(--ground); overflow: hidden; }
  .lejek .wypelnienie { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-hi)); }
  .lejek .spadek {
    grid-column: 1 / -1; font-size: .75rem; color: var(--ink-3);
    margin: -.15rem 0 .1rem; padding-left: .1rem;
  }
  .lejek .spadek b { color: var(--ostrzez); font-weight: 600; }

  /* ——— Miasta ——— */
  .miasta { border: 1px solid var(--rule); border-radius: 14px; background: var(--raised); padding: 1.25rem 1.35rem 1.4rem; display: grid; gap: .7rem; }
  .miasto { display: grid; grid-template-columns: 1fr auto; gap: .25rem .75rem; align-items: baseline; }
  .miasto .nazwa-m { font-size: .88rem; font-weight: 600; }
  .miasto .nazwa-m .martwe { font-size: .72rem; font-weight: 500; color: var(--ostrzez); margin-left: .45rem; }
  .miasto .ile { font-family: var(--mono); font-size: .8rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .miasto .tor { grid-column: 1 / -1; height: 7px; border-radius: 99px; background: var(--ground); overflow: hidden; }
  .miasto .wypelnienie { height: 100%; border-radius: 99px; background: var(--accent); }
  .miasto.bez-masy .wypelnienie { background: var(--ink-3); }

  /* ——— Lista kont ——— */
  .konta { border: 1px solid var(--rule); border-radius: 14px; background: var(--raised); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; min-width: 44rem; }
  th {
    text-align: left; font-family: var(--mono); font-size: .68rem; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
    padding: .9rem 1rem .6rem; border-bottom: 1px solid var(--rule); white-space: nowrap;
  }
  td { padding: .7rem 1rem; border-bottom: 1px solid color-mix(in srgb, var(--rule) 55%, transparent); vertical-align: baseline; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: color-mix(in srgb, var(--accent) 4%, transparent); }
  td.liczbowa { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink-2); }
  td .mail { color: var(--ink-3); font-size: .78rem; display: block; }
  .znak {
    display: inline-block; font-family: var(--mono); font-size: .66rem; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase;
    padding: .12rem .45rem; border-radius: 5px; white-space: nowrap;
  }
  .znak.uzytkownik   { color: var(--accent);  background: rgba(34,197,139,.12); }
  .znak.administrator{ color: #8AB4F8;        background: rgba(138,180,248,.12); }
  .znak.recenzja     { color: var(--ostrzez); background: rgba(232,163,61,.12); }
  .znak.statysta     { color: var(--ink-3);   background: rgba(154,166,178,.10); }
  .znak.ban          { color: var(--blad);    background: rgba(255,90,78,.14); }
  .filtr { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .85rem; }
  .filtr button {
    font: inherit; font-size: .78rem; color: var(--ink-2);
    background: var(--raised); border: 1px solid var(--rule); border-radius: 99px;
    padding: .28rem .8rem; cursor: pointer;
  }
  .filtr button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }

  .wykres { border: 1px solid var(--rule); border-radius: 14px; background: var(--raised); padding: 1.15rem 1.25rem 1rem; }
  .wykres h3 { font-size: .92rem; font-weight: 650; margin: 0 0 .15rem; }
  .wykres .pod { font-size: .78rem; color: var(--ink-3); margin: 0 0 1rem; }
  .wykres svg { width: 100%; height: 140px; display: block; overflow: visible; }
  .wykres .brak { font-size: .85rem; color: var(--ink-3); margin: 0; padding: 1.5rem 0; text-align: center; }

  footer { margin-top: 3rem; padding-top: 1.25rem; border-top: 1px solid var(--rule); font-size: .8rem; color: var(--ink-3); }
  footer a { color: var(--ink-2); text-decoration: none; }
  footer a:hover { color: var(--accent); text-decoration: underline; }

  /* ——— Moderacja ——— */
  .sprawa {
    border: 1px solid var(--rule); border-left: 3px solid var(--ostrzez);
    border-radius: 14px; background: var(--raised);
    padding: 1.05rem 1.2rem 1.15rem; display: grid; gap: .65rem;
  }
  .sprawa + .sprawa { margin-top: .8rem; }
  .sprawa .naglowek { display: flex; flex-wrap: wrap; gap: .35rem .7rem; align-items: baseline; }
  .sprawa .powod { font-size: .98rem; font-weight: 650; }
  .sprawa .kiedy { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); margin-left: auto; }
  .sprawa .meta { font-size: .82rem; color: var(--ink-2); margin: 0; }
  .sprawa .meta b { color: var(--ink); font-weight: 600; }
  .sprawa .cytat {
    margin: 0; padding: .55rem .8rem; background: var(--ground);
    border-left: 2px solid var(--rule); border-radius: 0 8px 8px 0;
    font-size: .88rem; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .sprawa .cytat.puste { color: var(--ink-3); font-style: italic; }
  .sprawa .kontekst { font-size: .77rem; color: var(--ink-3); margin: 0; }
  .sprawa .decyzja { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-top: .2rem; }
  .sprawa .decyzja input { flex: 1 1 13rem; width: auto; font-size: .85rem; padding: .5rem .7rem; }
  .sprawa button {
    font: inherit; font-size: .84rem; font-weight: 600; cursor: pointer;
    border: 1px solid var(--rule); border-radius: 9px; padding: .5rem .95rem;
    background: var(--raised); color: var(--ink-2);
  }
  .sprawa button.odrzuc:hover:enabled { border-color: var(--accent); color: var(--accent); }
  .sprawa button.zbanuj { border-color: rgba(255,90,78,.4); color: var(--blad); }
  .sprawa button.zbanuj:hover:enabled { background: rgba(255,90,78,.12); }
  .sprawa button:disabled { opacity: .5; cursor: default; }
  .sprawa .odzew { font-size: .82rem; margin: 0; }
  .sprawa .odzew.dobrze { color: var(--accent); }
  .sprawa .odzew.zle { color: var(--blad); }
  .recydywa { color: var(--ostrzez); font-weight: 600; }
  .spokoj {
    border: 1px dashed var(--rule); border-radius: 14px;
    padding: 1.5rem 1.2rem; text-align: center; color: var(--ink-3); font-size: .88rem;
  }
  details.historia { margin-top: 1.1rem; }
  details.historia summary { cursor: pointer; font-size: .82rem; color: var(--ink-2); }
  details.historia summary:hover { color: var(--accent); }
  details.historia .sprawa { border-left-color: var(--rule); opacity: .8; }
  details.historia .sprawa:first-of-type { margin-top: .8rem; }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<!-- ——— Ekran logowania ——— -->
<div class="brama" id="brama">
  <form id="formularz">
    <h1>Panel Find GymBro</h1>
    <p class="pod">Zaloguj się kontem z uprawnieniami administratora.</p>
    <label>E-mail
      <input type="email" id="mail" autocomplete="username" inputmode="email"
             autocapitalize="none" autocorrect="off" spellcheck="false" required>
    </label>
    <label>Hasło
      <input type="password" id="haslo" autocomplete="current-password" required>
    </label>
    <p class="blad-formularza" id="bladFormularza" hidden></p>
    <button class="glowny" id="zaloguj" type="submit">Zaloguj się</button>
  </form>
</div>

<!-- ——— Panel ——— -->
<div class="wrap" id="panel" hidden>
  <header>
    <h1 class="tytul">Find GymBro</h1>
    <span class="znacznik" id="znacznik">wczytywanie…</span>
    <span class="spacer"></span>
    <button class="drugi" id="odswiez">Odśwież</button>
    <button class="drugi" id="wyloguj">Wyloguj</button>
  </header>
  <div id="tresc"></div>
  <footer>
    Panel administracyjny. Zawiera dane użytkowników — nie udostępniaj tej strony.
    <a href="/">findgymbro.pl</a>
  </footer>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const ADRES_PROJEKTU = 'https://srhmakuqrvhecfpihzkn.supabase.co';
// Klucz publiczny — ten sam, który nosi w sobie aplikacja mobilna. Sam z siebie
// nie daje dostępu do niczego: statystyki widzi wyłącznie konto wpisane
// do tabeli administratorów, a sprawdza to funkcja brzegowa.
const KLUCZ_PUBLICZNY = 'sb_publishable_oCfgXUMYimV3DWIcChA5uA_PrVFCYtI';

const supabase = createClient(ADRES_PROJEKTU, KLUCZ_PUBLICZNY);

const brama = document.getElementById('brama');
const panel = document.getElementById('panel');
const formularz = document.getElementById('formularz');
const bladFormularza = document.getElementById('bladFormularza');
const przyciskZaloguj = document.getElementById('zaloguj');
const tresc = document.getElementById('tresc');
const znacznik = document.getElementById('znacznik');

const GRUPY = [
  { tytul: 'Ludzie', miary: ['konta', 'konta_potwierdzone', 'profile_ukonczone', 'aktywni_7_dni', 'aktywni_30_dni', 'nowi_7_dni'] },
  { tytul: 'Aktywność', miary: ['ogloszenia_aktywne', 'ogloszenia', 'zgloszenia', 'zgloszenia_przyjete', 'rozmowy', 'wiadomosci'] },
  { tytul: 'Treningi', miary: ['treningi_umowione', 'treningi_minione'] },
  { tytul: 'Moderacja', miary: ['zgloszenia_naduzyc', 'blokady', 'zbanowani'] },
];

const liczba = (n) => new Intl.NumberFormat('pl-PL').format(n);

/**
 * Ucieczka znaków dla wszystkiego, co napisał użytkownik.
 *
 * Panel składa widok z gotowych kawałków HTML, więc imię w rodzaju
 * `<img onerror=...>` wykonałoby się w przeglądarce administratora.
 * W moderacji to nie jest teoria: ona z definicji pokazuje treści osób,
 * które ktoś już zgłosił, więc wrogi wpis jest tam scenariuszem domyślnym.
 */
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (z) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[z]
));

/** Polska odmiana przez liczbę: 1 zgłoszenie, 2 zgłoszenia, 5 zgłoszeń. */
const odmiana = (n, jeden, kilka, wiele) => {
  const d = n % 10, s = n % 100;
  if (n === 1) return jeden;
  if (d >= 2 && d <= 4 && (s < 12 || s > 14)) return kilka;
  return wiele;
};

function kafel({ nazwa, wartosc, opis, zmiana, wyliczony }) {
  const zm = zmiana == null ? '' :
    `<span class="zmiana ${zmiana > 0 ? 'w-gore' : 'bez'}">${zmiana > 0 ? '+' + zmiana : '—'}</span>`;
  return `<div class="kafel${wyliczony ? ' wyliczony' : ''}">${zm}
    <span class="liczba">${wartosc}</span>
    <span class="nazwa">${nazwa}</span>
    <span class="opis">${opis}</span></div>`;
}

/** Wskaźniki, które faktycznie mówią, czy produkt działa. */
function wyliczone(m) {
  const k = [];
  const ogl = m.ogloszenia?.wartosc ?? 0, zgl = m.zgloszenia?.wartosc ?? 0;
  const przyj = m.zgloszenia_przyjete?.wartosc ?? 0;
  const konta = m.konta?.wartosc ?? 0, gotowe = m.profile_ukonczone?.wartosc ?? 0;
  if (konta > 0) k.push(kafel({ nazwa: 'Kreator do końca', wartosc: Math.round(gotowe / konta * 100) + '%',
    opis: `${gotowe} z ${konta} kont ma ukończony profil`, wyliczony: true }));
  if (ogl > 0) k.push(kafel({ nazwa: 'Zgłoszeń na ogłoszenie', wartosc: (zgl / ogl).toFixed(1),
    opis: 'ile osób średnio się zgłasza', wyliczony: true }));
  if (zgl > 0) k.push(kafel({ nazwa: 'Skuteczność zgłoszeń', wartosc: Math.round(przyj / zgl * 100) + '%',
    opis: `${przyj} z ${zgl} zgłoszeń przyjęto`, wyliczony: true }));
  return k;
}

/**
 * Lejek: sześć kroków od rejestracji do treningu.
 *
 * Szerokość paska liczymy względem PIERWSZEGO kroku, nie największego, bo
 * lejek z definicji tylko się zwęża — dzięki temu widać skalę odpadania.
 * Pod każdym przejściem piszemy, ile procent przeszło dalej i ilu ludzi
 * odpadło, bo sam procent nie mówi, czy to problem trzech osób czy trzystu.
 */
function lejek(kroki) {
  if (!kroki.length) return '';
  const baza = Math.max(kroki[0].osoby, 1);
  return `<div class="lejek">` + kroki.map((k, i) => {
    const poprz = i > 0 ? kroki[i - 1].osoby : null;
    const procent = poprz ? (poprz > 0 ? Math.round(k.osoby / poprz * 100) : 0) : null;
    const stracone = poprz ? poprz - k.osoby : 0;
    const przejscie = poprz == null ? '' :
      `<div class="spadek">${procent}% przeszło dalej${stracone > 0 ? `, <b>odpadło ${liczba(stracone)}</b>` : ''}</div>`;
    return `${przejscie}<div class="krok">
      <span class="etykieta">${k.krok}</span>
      <span class="osoby">${liczba(k.osoby)}</span>
      <div class="tor"><div class="wypelnienie" style="width:${Math.max(k.osoby / baza * 100, k.osoby > 0 ? 2 : 0)}%"></div></div>
    </div>`;
  }).join('') + `</div>`;
}

/** Miasta: obok liczby osób zaznaczamy te bez masy krytycznej. */
function miasta(lista) {
  if (!lista.length) return '<div class="miasta"><p class="brak">Brak danych o miastach.</p></div>';
  const max = Math.max(...lista.map((m) => m.osoby), 1);
  const bezMasy = lista.filter((m) => !m.ma_mase).length;
  return `<div class="miasta">` + lista.map((m) => `
    <div class="miasto${m.ma_mase ? '' : ' bez-masy'}">
      <span class="nazwa-m">${esc(m.miasto)}${m.ma_mase ? '' : '<span class="martwe">jedna osoba</span>'}</span>
      <span class="ile">${liczba(m.osoby)} os. · ${liczba(m.ogloszenia)} ogł.</span>
      <div class="tor"><div class="wypelnienie" style="width:${Math.max(m.osoby / max * 100, 3)}%"></div></div>
    </div>`).join('') +
    (bezMasy ? `<p class="opis" style="margin:.4rem 0 0;font-size:.78rem;color:var(--ink-3)">
      ${bezMasy} ${bezMasy === 1 ? 'miasto ma' : 'miast ma'} tylko jedną osobę — tam nie ma z kim trenować.</p>` : '') +
    `</div>`;
}

/** Data w formie „3 dni temu”, bo przy kontach liczy się świeżość, nie doba. */
function kiedy(iso) {
  if (!iso) return '—';
  const minut = Math.round((Date.now() - new Date(iso)) / 60000);
  if (minut < 60) return minut <= 1 ? 'przed chwilą' : `${minut} min temu`;
  const godzin = Math.round(minut / 60);
  if (godzin < 24) return `${godzin} godz. temu`;
  const dni = Math.round(godzin / 24);
  if (dni < 31) return dni === 1 ? 'wczoraj' : `${dni} dni temu`;
  return new Date(iso).toLocaleDateString('pl-PL');
}

let filtrKont = 'wszystkie';
let ostatnieKonta = [];

/**
 * Lista kont.
 *
 * Świadomie oszczędna: imię, adres, aktywność i to, co dana osoba zrobiła
 * w aplikacji. Bez ciężarów, opisu profilu i zdjęć — administrator ma widzieć,
 * kto to jest i czy jest aktywny, a nie przeglądać cudze profile.
 */
function konta(lista) {
  const licznik = lista.reduce((a, k) => (a[k.rodzaj] = (a[k.rodzaj] ?? 0) + 1, a), {});
  const widoczne = filtrKont === 'wszystkie' ? lista : lista.filter((k) => k.rodzaj === filtrKont);

  const filtry = ['wszystkie', 'użytkownik', 'administrator', 'recenzja', 'statysta']
    .filter((r) => r === 'wszystkie' || licznik[r])
    .map((r) => `<button data-filtr="${r}" aria-pressed="${r === filtrKont}">
      ${r}${r === 'wszystkie' ? ` (${lista.length})` : ` (${licznik[r]})`}</button>`).join('');

  const wiersze = widoczne.map((k) => `<tr>
    <td>
      <strong>${k.imie ? esc(k.imie) : '<span style="color:var(--ink-3)">bez profilu</span>'}</strong>
      ${k.zbanowany ? '<span class="znak ban">ban</span>' : ''}
      <span class="mail">${esc(k.email)}</span>
    </td>
    <td><span class="znak ${esc(k.rodzaj.replace('ż', 'z'))}">${esc(k.rodzaj)}</span></td>
    <td>${k.miasto ? esc(k.miasto) : '—'}</td>
    <td class="liczbowa">${k.ogloszen}</td>
    <td class="liczbowa">${k.zgloszen_wyslanych}</td>
    <td class="liczbowa">${kiedy(k.ostatnia_aktywnosc)}</td>
    <td class="liczbowa">${kiedy(k.utworzone)}</td>
  </tr>`).join('');

  return `<div class="filtr">${filtry}</div>
    <div class="konta"><table>
      <thead><tr>
        <th>Kto</th><th>Rodzaj</th><th>Miasto</th>
        <th>Ogł.</th><th>Zgł.</th><th>Aktywność</th><th>Konto od</th>
      </tr></thead>
      <tbody>${wiersze || '<tr><td colspan="7" style="color:var(--ink-3)">Brak kont w tej grupie.</td></tr>'}</tbody>
    </table></div>`;
}

function wykres(historia, klucz, tytul, pod) {
  const punkty = historia.map((h) => ({ dzien: h.dzien, v: Number(h.miary?.[klucz] ?? 0) }))
                         .filter((p) => Number.isFinite(p.v));
  if (punkty.length < 2) {
    return `<div class="wykres"><h3>${tytul}</h3><p class="pod">${pod}</p>
      <p class="brak">Trend pojawi się po drugim dniu zbierania migawek.</p></div>`;
  }
  const W = 600, H = 140;
  const max = Math.max(...punkty.map((p) => p.v), 1);
  const krok = W / (punkty.length - 1);
  const wsp = punkty.map((p, i) => [i * krok, H - (p.v / max) * (H - 12)]);
  const linia = wsp.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  const ost = punkty[punkty.length - 1];
  return `<div class="wykres"><h3>${tytul}</h3>
    <p class="pod">${pod} · ostatnio ${liczba(ost.v)} (${ost.dzien})</p>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${tytul}">
      <defs><linearGradient id="g-${klucz}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#22C58B" stop-opacity=".28"/>
        <stop offset="100%" stop-color="#22C58B" stop-opacity="0"/></linearGradient></defs>
      <path d="${linia} L${W},${H} L0,${H} Z" fill="url(#g-${klucz})"/>
      <path d="${linia}" fill="none" stroke="#22C58B" stroke-width="2"
            stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <circle cx="${wsp[wsp.length-1][0]}" cy="${wsp[wsp.length-1][1]}" r="3.5" fill="#7CF5C9"/>
    </svg></div>`;
}

/* ——————————————————————————————————————————————————————————————
   Moderacja

   Idzie na samą górę panelu, przed statystykami, bo jako jedyna część
   wymaga decyzji, a nie oglądania. Regulamin obiecuje reakcję w 48 godzin.
   —————————————————————————————————————————————————————————————— */

const NAZWA_TYPU = { profil: 'profil', ogloszenie: 'ogłoszenie', wiadomosc: 'wiadomość' };

function sprawa(z, zamknieta) {
  const recydywa = z.ile_zgloszen > 1
    ? ` · <span class="recydywa">${z.ile_zgloszen} ${odmiana(z.ile_zgloszen,
        'zgłoszenie', 'zgłoszenia', 'zgłoszeń')} na tę osobę</span>`
    : '';

  const cytat = z.tresc
    ? `<p class="cytat">${esc(z.tresc)}</p>`
    : `<p class="cytat puste">Zgłoszony materiał nie ma treści tekstowej.</p>`;

  const szczegoly = z.szczegoly
    ? `<p class="meta">Od zgłaszającego: ${esc(z.szczegoly)}</p>` : '';

  // Zbanowanemu nie ma czego banować drugi raz — zostaje samo zamknięcie sprawy.
  const stopka = zamknieta
    ? `<p class="meta">Decyzja: <b>${z.decyzja === 'ban' ? 'blokada konta' : 'zamknięte bez działań'}</b>
         ${z.rozpatrzono ? '· ' + kiedy(z.rozpatrzono) : ''}
         ${z.notatka_moderatora ? '· ' + esc(z.notatka_moderatora) : ''}</p>`
    : `<div class="decyzja">
         <input type="text" placeholder="${z.juz_zbanowany
            ? 'Notatka do zamknięcia (opcjonalnie)' : 'Powód decyzji'}"
                maxlength="200" aria-label="Powód decyzji">
         <button class="odrzuc" data-akcja="odrzuc">Zamknij bez działań</button>
         ${z.juz_zbanowany ? '' : '<button class="zbanuj" data-akcja="zbanuj">Zablokuj konto</button>'}
       </div>
       <p class="odzew" hidden></p>`;

  return `<div class="sprawa" data-id="${esc(z.id)}" data-kto="${esc(z.kto)}">
    <div class="naglowek">
      <span class="powod">${esc(z.powod)}</span>
      <span class="kiedy">${kiedy(z.zgloszono)}</span>
    </div>
    <p class="meta">Dotyczy: <b>${esc(z.kto)}</b>${z.juz_zbanowany
        ? ' <span class="znak ban">konto zablokowane</span>' : ''}
      · zgłosił: ${esc(z.zglaszajacy)} · ${NAZWA_TYPU[z.typ] ?? esc(z.typ)}${recydywa}</p>
    ${szczegoly}
    ${cytat}
    <p class="kontekst">${esc(z.kontekst ?? '')}</p>
    ${stopka}
  </div>`;
}

async function wczytajModeracje() {
  const [otwarte, zamkniete] = await Promise.all([
    supabase.rpc('moderacja_lista', { p_zalatwione: false }),
    supabase.rpc('moderacja_lista', { p_zalatwione: true }),
  ]);

  if (otwarte.error) {
    return `<div class="grupa"><h2>Moderacja</h2>
      <div class="komunikat"><h2>Nie udało się wczytać zgłoszeń</h2>
      <p>${esc(otwarte.error.message)}</p></div></div>`;
  }

  const lista = otwarte.data ?? [];
  const historia = zamkniete.error ? [] : (zamkniete.data ?? []);

  const czolo = lista.length
    ? lista.map((z) => sprawa(z, false)).join('')
    : `<p class="spokoj">Brak otwartych zgłoszeń. Nowe zobaczysz tutaj i dostaniesz push na telefon.</p>`;

  const ogon = historia.length
    ? `<details class="historia"><summary>Rozpatrzone sprawy (${historia.length})</summary>
         ${historia.map((z) => sprawa(z, true)).join('')}</details>`
    : '';

  const naglowek = lista.length
    ? `Moderacja — ${lista.length} ${odmiana(lista.length, 'sprawa', 'sprawy', 'spraw')} do decyzji`
    : 'Moderacja';

  return `<div class="grupa" id="grupa-moderacji"><h2>${naglowek}</h2>${czolo}${ogon}</div>`;
}

/** Obsługa obu przycisków decyzji. Po sukcesie przeładowujemy cały panel,
    bo blokada zmienia też statystyki i listę kont. */
async function decyzja(przycisk) {
  const karta = przycisk.closest('.sprawa');
  const pole = karta.querySelector('input');
  const odzew = karta.querySelector('.odzew');
  const powod = pole.value.trim();
  const ban = przycisk.dataset.akcja === 'zbanuj';

  const pokaz = (tekst, dobrze) => {
    odzew.textContent = tekst;
    odzew.className = `odzew ${dobrze ? 'dobrze' : 'zle'}`;
    odzew.hidden = false;
  };

  if (ban && !powod) {
    pokaz('Podaj powód blokady — trafia do rejestru decyzji.', false);
    pole.focus();
    return;
  }
  if (ban && !confirm(
    `Zablokować konto „${karta.dataset.kto}"?\n\n` +
    'Ogłoszenia zostaną anulowane, umówione treningi odwołane, rozmowy zamknięte, ' +
    'a logowanie przestanie działać. Cofnąć da się tylko z bazy.'
  )) return;

  karta.querySelectorAll('button').forEach((b) => (b.disabled = true));
  odzew.hidden = true;

  const { data, error } = ban
    ? await supabase.rpc('moderacja_zbanuj', { p_zgloszenie: karta.dataset.id, p_powod: powod })
    : await supabase.rpc('moderacja_odrzuc', { p_zgloszenie: karta.dataset.id, p_notatka: powod || null });

  if (error) {
    karta.querySelectorAll('button').forEach((b) => (b.disabled = false));
    pokaz(error.message, false);
    return;
  }
  pokaz(data ?? 'Gotowe.', true);
  setTimeout(wczytaj, 900);
}

async function wczytaj() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) return pokazBrame();

  znacznik.textContent = 'wczytywanie…';
  try {
    // Moderacja idzie prosto do bazy, statystyki przez funkcję brzegową.
    // Równolegle, bo to dwie niezależne podróże.
    const [odp, moderacja] = await Promise.all([
      fetch(`${ADRES_PROJEKTU}/functions/v1/statystyki`, {
        headers: { Authorization: `Bearer ${session.access_token}` },
      }),
      wczytajModeracje(),
    ]);

    if (odp.status === 401) { await supabase.auth.signOut(); return pokazBrame('Sesja wygasła. Zaloguj się ponownie.'); }
    if (odp.status === 403) {
      tresc.innerHTML = `<div class="komunikat"><h2>Brak dostępu</h2>
        <p>To konto nie ma uprawnień do panelu. Zaloguj się kontem administratora.</p></div>`;
      znacznik.textContent = 'brak dostępu';
      return;
    }
    if (!odp.ok) {
      tresc.innerHTML = `<div class="komunikat"><h2>Serwer odpowiedział błędem</h2>
        <p>Kod ${odp.status}. Spróbuj ponownie za chwilę.</p></div>`;
      return;
    }

    const dane = await odp.json();
    const m = Object.fromEntries((dane.miary ?? []).map((x) => [x.miara, { wartosc: Number(x.wartosc), opis: x.opis }]));
    const hist = dane.historia ?? [];
    const wczoraj = hist.length >= 2 ? hist[hist.length - 2].miary : null;

    let html = moderacja;
    const wyl = wyliczone(m);
    if (wyl.length) html += `<div class="grupa"><h2>Wskaźniki</h2><div class="kafle">${wyl.join('')}</div></div>`;

    if (dane.lejek?.length) {
      html += `<div class="grupa"><h2>Lejek</h2>${lejek(dane.lejek)}</div>`;
    }

    if (dane.rynek?.length) {
      const kafle = dane.rynek.map((r) => kafel({
        nazwa: r.miara.replaceAll('_', ' '),
        wartosc: r.jednostka === '%' ? Math.round(r.wartosc) + '%'
               : r.jednostka === 'h' ? (Number(r.wartosc) < 1 && Number(r.wartosc) > 0
                    ? Math.round(Number(r.wartosc) * 60) + ' min' : Math.round(Number(r.wartosc)) + ' h')
               : liczba(Math.round(r.wartosc)),
        opis: r.opis,
        // Odsetek ogłoszeń bez odzewu to jedyna miara, w której wysoka
        // wartość jest zła — reszta jest neutralna albo dobra.
        wyliczony: r.miara === 'ogloszenia_bez_odzewu' && Number(r.wartosc) < 50,
      }));
      html += `<div class="grupa"><h2>Zdrowie rynku</h2><div class="kafle">${kafle.join('')}</div></div>`;
    }

    if (dane.geografia) {
      html += `<div class="grupa"><h2>Miasta</h2>${miasta(dane.geografia)}</div>`;
    }

    if (dane.konta?.length) {
      const prawdziwi = dane.konta.filter((k) => k.rodzaj === 'użytkownik').length;
      const ostrzezenie = prawdziwi === 0
        ? `<div class="komunikat"><h2>Same konta własne</h2>
             <p>W bazie nie ma jeszcze ani jednego prawdziwego użytkownika. Statystyki powyżej
             liczą również konta administracyjne, recenzenckie i statystów, więc lejek i konwersja
             są na razie umowne.</p></div>`
        : '';
      html += `<div class="grupa"><h2>Konta</h2>${ostrzezenie}${konta(dane.konta)}</div>`;
      ostatnieKonta = dane.konta;
    }

    for (const g of GRUPY) {
      const kafle = g.miary.filter((k) => m[k]).map((k) => {
        const poprz = wczoraj?.[k];
        return kafel({
          nazwa: k.replaceAll('_', ' '), wartosc: liczba(m[k].wartosc), opis: m[k].opis,
          zmiana: poprz == null ? null : m[k].wartosc - Number(poprz),
        });
      });
      if (kafle.length) html += `<div class="grupa"><h2>${g.tytul}</h2><div class="kafle">${kafle.join('')}</div></div>`;
    }

    html += `<div class="grupa"><h2>Trend</h2>
      <div class="kafle" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
      ${wykres(hist, 'konta', 'Konta', 'wszystkie założone')}
      ${wykres(hist, 'ogloszenia', 'Ogłoszenia', 'wystawione łącznie')}
      </div></div>`;

    tresc.innerHTML = html;
    znacznik.textContent = `${dane.kto} · stan na ${new Date(dane.pobrano).toLocaleString('pl-PL')}`;
  } catch {
    tresc.innerHTML = `<div class="komunikat"><h2>Nie udało się połączyć</h2>
      <p>Sprawdź połączenie z internetem i spróbuj ponownie.</p></div>`;
  }
}

function pokazBrame(komunikat) {
  panel.hidden = true;
  brama.hidden = false;
  if (komunikat) { bladFormularza.textContent = komunikat; bladFormularza.hidden = false; }
}

function pokazPanel() {
  brama.hidden = true;
  panel.hidden = false;
  wczytaj();
}

formularz.addEventListener('submit', async (e) => {
  e.preventDefault();
  bladFormularza.hidden = true;
  przyciskZaloguj.disabled = true;
  przyciskZaloguj.textContent = 'Logowanie…';

  const { error } = await supabase.auth.signInWithPassword({
    email: document.getElementById('mail').value.trim(),
    password: document.getElementById('haslo').value,
  });

  przyciskZaloguj.disabled = false;
  przyciskZaloguj.textContent = 'Zaloguj się';

  if (error) {
    bladFormularza.textContent = /invalid login/i.test(error.message)
      ? 'Nieprawidłowy e-mail lub hasło.'
      : error.message;
    bladFormularza.hidden = false;
    return;
  }
  document.getElementById('haslo').value = '';
  pokazPanel();
});

// Decyzje moderacyjne. Delegacja, bo karty powstają przy każdym odświeżeniu.
tresc.addEventListener('click', (e) => {
  const przycisk = e.target.closest('[data-akcja]');
  if (przycisk) decyzja(przycisk);
});

// Filtr kont przerysowuje samą tabelę, bez ponownego pytania serwera.
tresc.addEventListener('click', (e) => {
  const przycisk = e.target.closest('[data-filtr]');
  if (!przycisk) return;
  filtrKont = przycisk.dataset.filtr;
  const grupa = przycisk.closest('.grupa');
  const komunikat = grupa.querySelector('.komunikat')?.outerHTML ?? '';
  grupa.innerHTML = `<h2>Konta</h2>${komunikat}${konta(ostatnieKonta)}`;
});

document.getElementById('odswiez').addEventListener('click', wczytaj);
document.getElementById('wyloguj').addEventListener('click', async () => {
  await supabase.auth.signOut();
  location.reload();
});

// Sesja przeżywa odświeżenie strony, więc przy powrocie nie trzeba się logować.
const { data: { session } } = await supabase.auth.getSession();
if (session) pokazPanel();
</script>
</body>
